<!DOCTYPE html>
<html>
    <head>
        <title>Pulse Quiz</title>
    <link rel="icon" type="image/png" href="pulse-hero-transparent-fixed.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/choice-list.css">
    <link rel="stylesheet" href="css/sticky-bar.css">
    <link rel="stylesheet" href="css/alert.css">
    <link rel="stylesheet" href="css/style.css">  
    </head>
    <body>
        <img class="pulse-hero" src="pulse-hero-transparent-fixed.png" alt="Pulse">
        <h1 id="headline-1"> Pulse Quiz </h1>
        <p id="tagline-1"> How well do you know the music? </p>

        <p id="score-text" class="sticky-bar">Score: 0</p> 
    <div class="card">
      <p id="question-1">Which band released "The Summoning"?</p>

      

      <button id="hint-button">Hint</button>
      <p id="hint-text"></p>

      <div class="choice-list">
        <button id="answer-1">Sleep Token</button>
        <button id="answer-2">Deftones</button>
        <button id="answer-3">Bad Omens</button>
      </div>

      <p id="feedback-1" class="alert"></p>
    </div>

    <div class="card">
    <p>Which band released "Knife Prty"?</p>

    <div class="choice-list">
        <button id="answer-4">Sleep Token</button>
        <button id="answer-5">Deftones</button>
        <button id="answer-6">Bad Omens</button>
    </div>

    <p id="feedback-2" class="alert"></p>
</div>

<div class="card">
    <p>Which band released "Impose"?</p>

    <div class="choice-list">
        <button id="answer-7">Deftones</button>
        <button id="answer-8">Bad Omens</button>
        <button id="answer-9">Sleep Token</button>
    </div>
    <p id="feedback-3" class="alert"></p>
</div>
<footer>
    <p>
        Created by Matthew Wainwright, 2026
        <a href="https://github.com/mattwainwright-dev" target="_blank">GitHub</a>
    </p>
    <p class="mftp">🤘 MFTP 🫶</p>
</footer>
        <script src="script.js"></script>
    </body>
</html>
