<!DOCTYPE html>
<html>
    <head>
        <title>Pulse Quiz</title>

        <!-- Pulse favicon -->
        <link rel="icon" type="image/png" href="pulse-hero-transparent-fixed.png">

        <!-- Pico CSS framework -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">

        <!-- Quiz CSS components -->
        <link rel="stylesheet" href="css/card.css">
        <link rel="stylesheet" href="css/choice-list.css">
        <link rel="stylesheet" href="css/sticky-bar.css">
        <link rel="stylesheet" href="css/alert.css">

        <!-- Custom Pulse styling -->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <!-- Pulse branding and quiz introduction -->
        <img class="pulse-hero" src="pulse-hero-transparent-fixed.png" alt="Pulse">
        <h1 id="headline-1">Pulse Quiz</h1>
        <p id="tagline-1">How well do you know the music?</p>

        <!-- Running quiz score -->
        <p id="score-text" class="sticky-bar">Score: 0</p>

        <!-- Question 1 -->
        <div class="card" id="question-card-1">
            <p class="question-number">Question 1 of 3</p>
            <p id="q1-prompt"></p>

            <button id="hint-button">Hint</button>
            <p id="hint-text"></p>

            <div class="choice-list">
                <button id="q1-a1"></button>
                <button id="q1-a2"></button>
                <button id="q1-a3"></button>
            </div>

            <p id="q1-feedback" class="alert"></p>
        </div>

        <!-- Question 2 -->
        <div class="card" id="question-card-2">
            <p class="question-number">Question 2 of 3</p>
            <p id="q2-prompt"></p>

            <div class="choice-list">
                <button id="q2-a1"></button>
                <button id="q2-a2"></button>
                <button id="q2-a3"></button>
            </div>

            <p id="q2-feedback" class="alert"></p>
        </div>

        <!-- Question 3 -->
        <div class="card" id="question-card-3">
            <p class="question-number">Question 3 of 3</p>
            <p id="q3-prompt"></p>

            <div class="choice-list">
                <button id="q3-a1"></button>
                <button id="q3-a2"></button>
                <button id="q3-a3"></button>
            </div>

            <p id="q3-feedback" class="alert"></p>
        </div>

        <!-- Bonus Question -->
        <div class="card" id="question-card-4">
            <p class="question-number">BONUS — TRUE OR FALSE</p>
            <p>On the official White Pony release, Deftones had a track called "Knife Party."</p>

        <div class="choice-list">
            <button id="answer-10">True</button>
            <button id="answer-11">False</button>
        </div>

            <p id="feedback-4" class="alert"></p>
        </div>

        <!-- Reset the quiz and play again -->
        <button id="start-over">Start Over</button>

        <!-- Creator information -->
        <footer>
            <p>
                Created by Matthew Wainwright, 2026
                <a href="https://github.com/mattwainwright-dev" target="_blank">GitHub</a>
            </p>

            <p class="mftp">🤘 MFTP 🫶</p>
        </footer>

        <!-- Quiz JavaScript -->
        <script src="script.js"></script>
    </body>
</html>
